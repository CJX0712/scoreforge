name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked deps)
        run: pip install -r requirements.lock.txt pytest ruff
      - name: Lint (ruff check + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (pytest)
        run: pytest tests -q
      - name: Fast benchmark + determinism gate
        run: python -m scoreforge.examples.run_demo --fast
